<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2e8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />
    <title>Focus Router</title>
    <style>
      :root {
        --page-bg: #f5f2e8;
        --card-bg: #faf9f5;
        --surface: #ffffff;
        --ink: #2a2a28;
        --text-strong: #3a3a37;
        --text-on-chip: #5a5a56;
        --text-chip-mid: #6a6a66;
        --text-body: #7a7a76;
        --text-label: #9a9a95;
        --text-faint: #b0aea6;
        --border-soft: #e8e6df;
        --border-chip: #e6e4dd;
        --border-input: #dddddd;
        --border-ghost: #e0ded7;
        --disabled-bg: #dcdad3;
        --btn-neutral: #2a2a28;
        --danger: #c0392b;
        --focus-ring: #6a7fb5;
        --mode-high: #d97757;
        --mode-med: #6a7fb5;
        --mode-low: #5b8c7a;
      }
      :root[data-theme="dark"] {
        --page-bg: #1a1916;
        --card-bg: #24221d;
        --surface: #2d2b25;
        --ink: #ebe9e2;
        --text-strong: #d4d1c9;
        --text-on-chip: #c0bdb4;
        --text-chip-mid: #b0ada4;
        --text-body: #9a978e;
        --text-label: #8a877e;
        --text-faint: #6e6c63;
        --border-soft: #3a3832;
        --border-chip: #3f3d37;
        --border-input: #454339;
        --border-ghost: #454339;
        --disabled-bg: #3a3832;
        --btn-neutral: #4a4843;
        --danger: #e57565;
        --focus-ring: #8fa3d4;
        --mode-high: #e88a6e;
        --mode-med: #8fa3d4;
        --mode-low: #7caa97;
      }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        background: var(--page-bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
      button { font-family: inherit; cursor: pointer; }
      input { font-family: inherit; color: var(--ink); }
      :focus { outline: none; }
      :focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
        border-radius: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: 0ms !important;
          animation-duration: 0ms !important;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('focus_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var t = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', t === 'dark' ? '#1a1916' : '#f5f2e8');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
