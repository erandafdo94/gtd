<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0f" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=4" />
    <title>Focus Router</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      /* FOCUS ROUTER — Console design system.
         Sharp · data-forward · friendly-geometric · dark only.
         DM Sans (UI) + Space Mono (data). One electric pop: #ff5a36. */
      :root {
        /* surfaces — near-black canvas, layered graphite panels */
        --bg:         #0b0c0f;
        --bg-deep:    #07080a;
        --surface:    #14161b;
        --surface-2:  #1b1e25;
        --surface-3:  #23272f;
        --hair:       #262a33;
        --line:       #323742;

        /* ink */
        --text:       #edeef2;
        --text-2:     #b4b8c2;
        --dim:        #888d99;
        --faint:      #5b606c;

        /* the one accent */
        --accent:     #ff5a36;
        --accent-2:   #ff7a5c;
        --accent-ink: #0b0c0f;
        --accent-soft:#ff5a3622;
        --accent-line:#ff5a3659;
        --accent-glow:rgba(255,90,54,0.40);

        /* data deltas */
        --up:   #34d6a4;
        --down: #ff5d6e;

        /* form */
        --r-card: 15px;
        --r-ctrl: 10px;
        --shadow:      0 1px 0 rgba(0,0,0,.5), 0 14px 34px -18px rgba(0,0,0,.8);
        --shadow-lift: 0 2px 0 rgba(0,0,0,.5), 0 26px 60px -24px rgba(0,0,0,.9);

        --sans: "DM Sans", system-ui, -apple-system, sans-serif;
        --mono: "Space Mono", ui-monospace, "SF Mono", monospace;
        color-scheme: dark;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        font-feature-settings: "ss01" on;
      }
      #root { min-height: 100vh; position: relative; }

      /* techy canvas: faint dot grid + a single warm glow up top */
      body::before {
        content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
        background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
        background-size: 22px 22px;
        -webkit-mask-image: radial-gradient(130% 80% at 50% -10%, #000 40%, transparent 100%);
                mask-image: radial-gradient(130% 80% at 50% -10%, #000 40%, transparent 100%);
      }
      body::after {
        content: ""; position: fixed; top: -240px; left: 50%; transform: translateX(-50%);
        width: 900px; height: 520px; pointer-events: none; z-index: 0;
        background: radial-gradient(ellipse at center, rgba(255,90,54,0.10), transparent 68%);
        filter: blur(8px);
      }

      button { font-family: inherit; cursor: pointer; }
      input, select, textarea { font-family: inherit; }
      ::placeholder { color: var(--faint); }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      ::selection { background: var(--accent-soft); color: var(--text); }
      select { color-scheme: dark; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
