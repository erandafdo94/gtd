  <rect x="46"  y="134" width="44" height="70"  rx="22" fill="#5b8c7a" />
  <rect x="106" y="94"  width="44" height="110" rx="22" fill="#6a7fb5" />
  <rect x="166" y="54"  width="44" height="150" rx="22" fill="#d97757" />
</svg>
