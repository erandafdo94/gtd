<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Focus Router">
  <title>Focus Router</title>
  <style>
    .tile { fill: #f3efe3; }
    .arc  { stroke: #d97757; }
    .dot  { fill: #2a2a28; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #221f1c; }
      .arc  { stroke: #e58a6c; }
      .dot  { fill: #ece9e2; }
    }
  </style>
  <rect x="2" y="2" width="60" height="60" rx="15" class="tile" />
  <path d="M 32 14 A 18 18 0 1 1 22.4 17.0" fill="none" class="arc" stroke-width="5" stroke-linecap="round" />
  <circle cx="32" cy="32" r="6" class="dot" />
</svg>
